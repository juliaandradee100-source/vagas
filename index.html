
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vagas de Emprego</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form id="formulario">
    <h1>Cadastro para Vagas</h1>
    <p>Preencha seus dados para se candidatar a uma oportunidade.</p>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome"
      placeholder="Digite seu nome" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email"
      placeholder="Digite seu e-mail" required>

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone"
      placeholder="(61) 99999-9999">

    <label for="vaga">Vaga desejada</label>
    <select id="vaga" name="vaga" required>
      <option value="">Selecione uma vaga</option>
      <option value="Atendente">Atendente</option>
      <option value="Auxiliar Administrativo">Auxiliar Administrativo</option>
      <option value="Jovem Aprendiz">Jovem Aprendiz</option>
      <option value="Vendedor">Vendedor</option>
      <option value="Recepcionista">Recepcionista</option>
      <option value="Estoquista">Estoquista</option>
    </select>

    <label for="experiencia">Experiência profissional</label>
    <select id="experiencia" name="experiencia" required>
      <option value="">Selecione uma opção</option>
      <option value="Sem experiência">Sem experiência</option>
      <option value="Menos de 1 ano">Menos de 1 ano</option>
      <option value="1 a 3 anos">1 a 3 anos</option>
      <option value="Mais de 3 anos">Mais de 3 anos</option>
    </select>

    <label for="escolaridade">Escolaridade</label>
    <select id="escolaridade" name="escolaridade" required>
      <option value="">Selecione sua escolaridade</option>
      <option value="Ensino Fundamental">Ensino Fundamental</option>
      <option value="Ensino Médio">Ensino Médio</option>
      <option value="Ensino Técnico">Ensino Técnico</option>
      <option value="Ensino Superior">Ensino Superior</option>
    </select>

    <label for="mensagem">Fale um pouco sobre você</label>
    <textarea id="mensagem" name="mensagem"
      placeholder="Conte sobre suas habilidades e qualificações"></textarea>

    <label for="curriculo">Link do currículo (opcional)</label>
    <input type="url" id="curriculo" name="curriculo"
      placeholder="https://...">

    <button type="submit">Enviar candidatura</button>

    <p id="aviso"></p>
  </form>

  <script src="script.js"></script>
</body>
</html>
